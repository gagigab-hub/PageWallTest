      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify fixed test signing certificate
        shell: bash
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | sed -n '1,30p'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PageWall-v20-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
